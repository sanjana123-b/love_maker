name: LoveMatch CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: lovematch_test_db
          POSTGRES_USER: loveuser
          POSTGRES_PASSWORD: lovepass
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System & Security Check
        env:
          DATABASE_URL: postgres://loveuser:lovepass@localhost:5432/lovematch_test_db
        run: |
          python manage.py check

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgres://loveuser:lovepass@localhost:5432/lovematch_test_db
          SECRET_KEY: ci-secret-key-12345
          DEBUG: True
        run: |
          pytest --cov=. --cov-report=term-missing

  build-container:
    name: Verify Docker Container Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lovematch:latest
