version: '3.8'

services:
  # Web Application Service (Daphne ASGI)
  web:
    build: .
    container_name: lovematch_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-secure-random-key-change-in-env-998877
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://loveuser:lovepass@db:5432/lovematch_db
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNELS=True
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles

  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: lovematch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lovematch_db
      POSTGRES_USER: loveuser
      POSTGRES_PASSWORD: lovepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loveuser -d lovematch_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Redis In-Memory Cache & WebSocket Channel Layer
  redis:
    image: redis:7-alpine
    container_name: lovematch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:
